[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinking-system"
version = "0.0.1"
description = "Brain-inspired thinking system that improves its understanding over time (MVP: predictive loop)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7"]
text = ["pymupdf>=1.24"]  # чтение PDF-книг (Markdown/txt работают без него)
dl = ["torch>=2.0"]       # GPU/torch-бэкенд предикторов (тот же интерфейс)
arc = ["arckit>=1.0"]     # датасет ARC-AGI-1 для run_arc.py (или JSON в data/arc/)

[project.scripts]
thinking-mvp = "run_mvp:main"

[tool.setuptools]
py-modules = ["run_mvp"]

[tool.setuptools.packages.find]
include = ["thinking_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
